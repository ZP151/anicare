<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="design.css"><style>body{padding:32px;font-family:'Noto Sans SC',-apple-system,sans-serif;background:#e9ece7}h1{font-size:32px;margin:8px 0 12px}p{max-width:1040px;font-size:15px}.panels{display:flex;flex-wrap:wrap;gap:26px;margin-top:24px}.panel{width:402px}.panel img{width:402px;display:block;border-radius:38px}.panel h2{margin:0 0 10px;font-size:18px}.panel p{font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0;align-items:center}button{border:1px solid #cbd3cb;border-radius:22px;background:#fff;padding:12px 18px;color:#164b38;min-height:44px}iframe{width:402px;height:874px;border:0;border-radius:44px}a{color:#176b56;text-decoration:underline}.intro{font-size:13px;color:#68746a}.selected{background:#176b56;color:white}label{font-size:14px}@media(max-width:480px){body{padding:12px}.panel,iframe{max-width:100%}}</style><title>玻璃材质 v2 对比</title></head><body><div class="intro">WHISKER COMMONS · DESIGN REVIEW · 2026.09.08</div><h1>保留布局，让玻璃真正透出背景。</h1><p>新版加强磨砂模糊、背景色传递与边缘高光；文字和内容仍保持清晰。以下为设计渲染，非 iPhone 运行截图。</p><div class="panels"><section class="panel"><h2>01 / 上一版</h2><img src="assets/reference-v1-map.png"><p>导航偏白，材质层次不明显。</p></section><section class="panel"><h2>02 / 新版地图</h2><img src="screens/A02.png"><p>水域颜色透过底栏，道路轮廓被磨砂模糊。</p></section><section class="panel"><h2>03 / 新版照片控件</h2><img src="screens/B03.png"><p>返回和关注使用磨砂圆形控件，图标保持对比。</p></section></div></body></html>
