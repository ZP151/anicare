name: iOS Device Lab

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lock_present: ${{ steps.state.outputs.lock_present }}
      readiness_present: ${{ steps.state.outputs.readiness_present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read reviewed prerequisite presence
        id: state
        run: |
          if test -f apps/mobile/ios-device-lab/Podfile.lock; then
            echo 'lock_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'lock_present=false' >> "$GITHUB_OUTPUT"
          fi
          if test -f docs/evidence/pilot-gate-2b-readiness.json; then
            echo 'readiness_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'readiness_present=false' >> "$GITHUB_OUTPUT"
          fi

  lock_bootstrap:
    needs: [preflight]
    if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.lock_present == 'false' }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3.12
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the pinned native toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.4.1'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17E202'
          test "$(node --version)" = 'v22.23.1'
          test "$(pnpm --version)" = '11.19.0'
          test "$(ruby --version | awk '{print $2}')" = '3.3.12'
          pod _1.17.0_ --version
      - name: Validate repository policy contracts
        run: |
          pnpm validate:pilot-policies
          pnpm test:root-contracts
          pnpm test:ios-device-lab-policy
      - name: Resolve the missing Pod lock only
        working-directory: apps/mobile
        env:
          GOOGLE_MAPS_IOS_API_KEY: compile-probe-google-maps-ios-key
          EXPO_PUBLIC_SUPABASE_URL: https://compile-probe.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: compile-probe-supabase-public-key
        run: |
          pnpm exec expo prebuild --clean --platform ios --no-install
          cd ios
          pod _1.17.0_ install
      - name: Upload the generated Pod lock for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-device-lab-podfile-lock
          path: apps/mobile/ios/Podfile.lock
          if-no-files-found: error
          retention-days: 3
      - name: Remove generated native files
        if: always()
        run: rm -rf -- apps/mobile/ios

  pr_compile:
    needs: [preflight]
    if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.lock_present == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3.12
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the pinned native toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.4.1'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17E202'
          test "$(node --version)" = 'v22.23.1'
          test "$(pnpm --version)" = '11.19.0'
          test "$(ruby --version | awk '{print $2}')" = '3.3.12'
          pod _1.17.0_ --version
      - name: Validate repository policy contracts
        run: |
          pnpm validate:pilot-policies
          pnpm test:root-contracts
          pnpm test:ios-device-lab-policy
      - name: Validate and build the non-installable compile probe
        env:
          GOOGLE_MAPS_IOS_API_KEY: compile-probe-google-maps-ios-key
          EXPO_PUBLIC_SUPABASE_URL: https://compile-probe.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: compile-probe-supabase-public-key
        run: |
          pnpm validate:ios-device-lab
          pnpm --filter @animalhelper/mobile build:unsigned-ios
      - name: Remove non-installable compile outputs
        if: always()
        run: |
          rm -rf -- apps/mobile/ios
          rm -rf -- apps/mobile/.ios-device-lab-staging
          rm -rf -- apps/mobile/.ios-device-lab-derived-data
          rm -rf -- apps/mobile/ios-device-lab-artifacts

  device_candidate:
    needs: [preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.preflight.outputs.lock_present == 'true' && needs.preflight.outputs.readiness_present == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-device-lab
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the checked out immutable workflow commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3.12
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the pinned native toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.4.1'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17E202'
          test "$(node --version)" = 'v22.23.1'
          test "$(pnpm --version)" = '11.19.0'
          test "$(ruby --version | awk '{print $2}')" = '3.3.12'
          pod _1.17.0_ --version
      - name: Validate repository policy contracts
        run: |
          pnpm validate:pilot-policies
          pnpm test:root-contracts
          pnpm test:ios-device-lab-policy
      - name: Validate the protected runtime inputs
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm validate:ios-device-lab
      - name: Validate Gate 2B readiness evidence
        run: |
          pnpm exec tsx --eval "
            import { createHash } from 'node:crypto';
            import { execFileSync } from 'node:child_process';
            import { readdirSync, readFileSync } from 'node:fs';
            import { evaluateGate2BReadiness } from './apps/mobile/scripts/ios-device-lab-policy.ts';
            const migrationFilename = readdirSync('supabase/migrations').filter((value) => value.endsWith('.sql')).sort().at(-1);
            if (!migrationFilename) process.exit(1);
            const migrationHead = { filename: migrationFilename, sha256: createHash('sha256').update(readFileSync('supabase/migrations/' + migrationFilename)).digest('hex') };
            const edgeFunctionsTreeSha256 = createHash('sha256').update(execFileSync('git', ['ls-tree', '-r', 'HEAD', 'supabase/functions'])).digest('hex');
            const candidateCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const codes = evaluateGate2BReadiness({ evidence: JSON.parse(readFileSync('docs/evidence/pilot-gate-2b-readiness.json', 'utf8')), nowIso: new Date().toISOString(), candidateCommit, isAncestor: (source, candidate) => { try { execFileSync('git', ['merge-base', '--is-ancestor', source, candidate], { stdio: 'ignore' }); return true; } catch { return false; } }, migrationHead, edgeFunctionsTreeSha256 });
            if (codes.length > 0) { process.stderr.write(codes.join('\\n') + '\\n'); process.exit(1); }
          "
      - name: Validate the public key at the approved hosted origin
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 15 -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/settings" -o /dev/null
      - name: Build the protected unsigned candidate
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @animalhelper/mobile build:unsigned-ios
      - name: Attest the unsigned IPA provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: apps/mobile/ios-device-lab-artifacts/*.ipa
      - name: Upload the unsigned candidate allowlist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whiskercommons-unsigned-${{ github.sha }}
          path: |
            apps/mobile/ios-device-lab-artifacts/*.ipa
            apps/mobile/ios-device-lab-artifacts/*.manifest.json
            apps/mobile/ios-device-lab-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove generated candidate files
        if: always()
        run: |
          rm -rf -- apps/mobile/ios
          rm -rf -- apps/mobile/.ios-device-lab-staging
          rm -rf -- apps/mobile/.ios-device-lab-derived-data
          rm -rf -- apps/mobile/ios-device-lab-artifacts
