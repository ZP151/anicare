name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e "services/ai[dev]"
      - run: pnpm peers check
      - run: python -m ruff check services/ai
      - run: python -m mypy services/ai/src
      - run: pnpm verify
      - run: git diff --check

  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - run: node --test scripts/pilot-gate-inputs.test.mjs
      - run: node scripts/pilot-gate-inputs.mjs uuid
      - run: node scripts/pilot-gate-inputs.mjs deno
      - run: supabase start
      - run: supabase test db
      - run: supabase db lint --level warning
